name: Build, Push, and Deploy Node.js App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the fresh image from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/app:latest
            
            # Stop and remove the old container cleanly if it exists
            docker stop app-container || true
            docker rm app-container || true
            
            # Run the new container mapping port 3000 on EC2 to port 3000 inside the app
            docker run -d --name app-container --restart unless-stopped -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/app:latest

            # 4. Ensure Nginx is running
            sudo systemctl restart nginx