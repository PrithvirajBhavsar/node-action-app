name: Build, Push, and Deploy Node.js App

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Check if repo directory exists; if not, clone it. Otherwise, pull latest changes.
            if [ -d "/home/ubuntu/app" ]; then
              cd /home/ubuntu/app
              git pull origin main
            else
              echo "Directory not found! Cloning repository..."
              cd /home/ubuntu
              git clone https://github.com/PrithvirajBhavsar/node-action-app.git app
              cd app
            fi
            
            # Pull the fresh app image from Docker Hub
            docker compose pull app
            
            # Start/recreate containers cleanly using docker-compose
            docker compose up -d --remove-orphans

            # Ensure Nginx is running
            sudo systemctl restart nginx